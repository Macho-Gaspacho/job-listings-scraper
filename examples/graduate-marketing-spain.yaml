# ============================================================
# Example: a first job in marketing, in Madrid.
# The filter keeps Entry and Unknown levels and leaves Senior out.
# To try this search:
#     cp examples/graduate-marketing-spain.yaml config.yaml
#     python scrape.py
# ============================================================

roles:
  - Marketing

require_title_match: true

title_keywords:
  Marketing:
    - marketing
    - marketing graduate
    - graduate marketing

locations:
  - name: Madrid, Spain
    indeed_location: Madrid, Spain
    linkedin_location: Madrid, Spain
    remote: false
    distance_miles: 25

sources:
  - id: company_pages
    enabled: false
    kind: company site
  - id: we_work_remotely
    enabled: false
    kind: remote board
  - id: remote_ok
    enabled: false
    kind: remote board
  - id: remotive
    enabled: false
    kind: remote board
  - id: working_nomads
    enabled: false
    kind: remote board
  - id: indeed
    enabled: true
    kind: aggregator
  - id: linkedin
    enabled: true
    kind: aggregator

companies: []

country: spain

filters:
  levels: [Entry, Unknown]

# timezone: Europe/Madrid

results_per_search: 10
posted_within_days: 30
pause_seconds: 2
fetch_descriptions: true
snippet_characters: 280

output:
  directory: output
  csv: jobs.csv
  excel: jobs.xlsx
  seen_file: data/seen_jobs.json
