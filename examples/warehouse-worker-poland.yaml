# ============================================================
# Example: a warehouse worker in Warsaw.
# Polish titles are included so a local posting is not missed.
# To try this search:
#     cp examples/warehouse-worker-poland.yaml config.yaml
#     python scrape.py
# ============================================================

roles:
  - Warehouse Worker

require_title_match: true

title_keywords:
  Warehouse Worker:
    - warehouse worker
    - warehouse operative
    - magazynier
    - pracownik magazynu

locations:
  - name: Warsaw, Poland
    indeed_location: Warsaw, Poland
    linkedin_location: Warsaw, Poland
    remote: false
    distance_miles: 25

sources:
  - id: company_pages
    enabled: false
    kind: company site
  - id: we_work_remotely
    enabled: false
    kind: remote board
  - id: remote_ok
    enabled: false
    kind: remote board
  - id: remotive
    enabled: false
    kind: remote board
  - id: working_nomads
    enabled: false
    kind: remote board
  - id: indeed
    enabled: true
    kind: aggregator
  - id: linkedin
    enabled: true
    kind: aggregator

companies: []

country: poland

# timezone: Europe/Warsaw

results_per_search: 10
posted_within_days: 30
pause_seconds: 2
fetch_descriptions: true
snippet_characters: 280

output:
  directory: output
  csv: jobs.csv
  excel: jobs.xlsx
  seen_file: data/seen_jobs.json
