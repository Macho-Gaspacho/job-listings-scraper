# ============================================================
# Example: an accountant in Toronto.
# English and French titles are both listed.
# To try this search:
#     cp examples/accountant-toronto-canada.yaml config.yaml
#     python scrape.py
# ============================================================

roles:
  - Accountant

require_title_match: true

title_keywords:
  Accountant:
    - accountant
    - comptable

locations:
  - name: Toronto, Canada
    indeed_location: Toronto, ON
    linkedin_location: Toronto, Ontario, Canada
    remote: false
    distance_miles: 25

sources:
  - id: company_pages
    enabled: false
    kind: company site
  - id: we_work_remotely
    enabled: false
    kind: remote board
  - id: remote_ok
    enabled: false
    kind: remote board
  - id: remotive
    enabled: false
    kind: remote board
  - id: working_nomads
    enabled: false
    kind: remote board
  - id: indeed
    enabled: true
    kind: aggregator
  - id: linkedin
    enabled: true
    kind: aggregator

companies: []

country: canada

# timezone: America/Toronto

# Optional. Leave this out to keep every job that matches the title and place.
# filters:
#   job_types: [Full-time]
#   min_salary: 50000

results_per_search: 10
posted_within_days: 30
pause_seconds: 2
fetch_descriptions: true
snippet_characters: 280

output:
  directory: output
  csv: jobs.csv
  excel: jobs.xlsx
  seen_file: data/seen_jobs.json
