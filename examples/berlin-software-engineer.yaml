# ============================================================
# Example: Software Engineer in Berlin, and remote jobs in Germany.
# To try this search, copy the file and run the scraper:
#     cp examples/berlin-software-engineer.yaml config.yaml
#     python scrape.py
# You do not need to edit any Python files.
# ============================================================

roles:
  - Software Engineer

require_title_match: true

title_keywords:
  Software Engineer:
    - software engineer
    - software developer
    - backend engineer
    - frontend engineer

locations:
  - name: Berlin, Germany
    indeed_location: Berlin, Germany
    linkedin_location: Berlin, Germany
    remote: false
    distance_miles: 25
  - name: Remote
    indeed_location: Germany
    linkedin_location: Germany
    remote: true

# Indeed and LinkedIn are enough for most searches.
# Company pages and the remote boards are off in this example.
# Turn them on if you want them: they follow the Berlin and Germany
# places above, not a city baked into the program.
# On we_work_remotely, an optional "categories" list (product, design, ...)
# picks feeds. Leave it out to read the all-jobs feed.
sources:
  - id: company_pages
    enabled: false
    kind: company site
  - id: we_work_remotely
    enabled: false
    kind: remote board
  - id: remote_ok
    enabled: false
    kind: remote board
  - id: remotive
    enabled: false
    kind: remote board
  - id: working_nomads
    enabled: false
    kind: remote board
  - id: indeed
    enabled: true
    kind: aggregator
  - id: linkedin
    enabled: true
    kind: aggregator

# Optional. Leave this empty, or add employers whose public careers
# page you want to read. See README.md for the address-to-token table.
companies: []

country: germany

# Optional. When you leave this out, the run summary uses your computer's clock.
# timezone: Europe/Berlin

results_per_search: 10
posted_within_days: 30
pause_seconds: 2
fetch_descriptions: true
snippet_characters: 280

output:
  directory: output
  csv: jobs.csv
  excel: jobs.xlsx
  seen_file: data/seen_jobs.json
