# Which public sources to use for a country. Data only. The program does not fetch link-outs.
tiers: [company, board, remote, link_out, aggregator]
defaults:
  board: []
  link_out: [linkedin_jobs_search_link, eures]
  aggregator: [indeed, linkedin]
countries:
  germany:
    board: [arbeitnow]
    link_out: [welcome_to_the_jungle, wellfound, eures, bundesagentur_link]
    aggregator: [indeed, linkedin]
  austria:
    board: [arbeitnow]
    link_out: [eures]
    aggregator: [indeed, linkedin]
  switzerland:
    board: [arbeitnow]
    link_out: [eures]
    aggregator: [indeed, linkedin]
  italy:
    board: []
    link_out: [welcome_to_the_jungle, eures]
    aggregator: [indeed, linkedin]
  netherlands:
    board: []
    link_out: [welcome_to_the_jungle, eures]
    aggregator: [indeed, linkedin]
  france:
    # apec_link is omitted: the public search URL answered HTTP 403.
    board: []
    link_out: [welcome_to_the_jungle, eures]
    aggregator: [indeed, linkedin]
  spain:
    board: []
    link_out: [welcome_to_the_jungle, eures]
    aggregator: [indeed, linkedin]
  uk:
    board: []
    link_out: [welcome_to_the_jungle, wellfound]
    aggregator: [indeed, linkedin]
  poland:
    board: []
    link_out: [eures, justjoinit_link]
    aggregator: [indeed, linkedin]
remote:
  remote: [remotive, we_work_remotely, remote_ok, working_nomads]
# epso_traineeships is omitted: no public search URL with {q} and {loc} returned HTTP 200.
graduate_link_outs: [un_careers_internships]
# Big 4 and large banks have no public job API we can read. These are links to open.
# Omitted after a failed open: kpmg_nl (careers URL redirected to the homepage),
# rabobank (HTTP 403), intesa_sanpaolo (HTTP 404), bnp_paribas (HTTP 403),
# pwc_fr and pwc_es (HTTP 404).
employer_link_outs:
  germany:
    - deloitte_de_careers
    - pwc_de_careers
    - ey_de_careers
    - kpmg_de_careers
    - deutsche_bank_careers
    - commerzbank_careers
  uk:
    - deloitte_uk_careers
    - pwc_uk_careers
    - ey_uk_careers
    - kpmg_uk_careers
    - barclays_careers
    - hsbc_careers
    - lloyds_careers
  italy:
    - deloitte_it_careers
    - pwc_it_careers
    - ey_it_careers
    - kpmg_it_careers
    - unicredit_careers
  netherlands:
    - deloitte_nl_careers
    - pwc_nl_careers
    - ey_nl_careers
    - ing_careers
    - abn_amro_careers
  france:
    - deloitte_fr_careers
    - ey_fr_careers
    - kpmg_fr_careers
    - societe_generale_careers
  spain:
    - deloitte_es_careers
    - ey_es_careers
    - kpmg_es_careers
    - santander_careers
    - bbva_careers
  poland:
    - deloitte_pl_careers
    - pwc_pl_careers
    - ey_pl_careers
    - kpmg_pl_careers
auto_words:
  - any
  - any site
  - any website
  - any relevant site
  - any relevant website
  - all
  - любой
  - любые
  - любой сайт
  - все
  - не знаю
  - незнаю
  - без разницы
  - qualsiasi
  - tutti
  - non so
  - egal
  - alle
  - weiß nicht
  - weiss nicht
  - n'importe
  - tous
  - je ne sais pas
  - cualquiera
  - todos
  - no sé
  - no se
  - don't know
  - dont know
  - idk
  - "?"
  - recommended
  - best
link_outs:
  welcome_to_the_jungle:
    label: Welcome to the Jungle
    url: "https://www.welcometothejungle.com/en/jobs?query={q}&aroundQuery={loc}"
