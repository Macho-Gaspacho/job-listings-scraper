[project]
name = "job-listings-scraper"
version = "1.0.0"
description = "Collect public job listings into one Excel file for any profession and any location."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "python-jobspy==1.4.0",
  "PyYAML==6.0.3",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.14.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
