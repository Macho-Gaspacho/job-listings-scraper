review_notes:
  - "Double-check: Canadian resumes normally omit a photo, date of birth, age, marital status, and nationality. This preset drops them even if they are in your profile. Some public-sector forms ask for data this preset leaves out; add that by hand after you read the form."
  - "Double-check: one page is the usual expectation, and two pages after about ten years. Academic CVs are often longer. The page count here is a word estimate, not a Word layout."
