review_notes:
  - "Double-check: Europass is a recommended structure, not a law, and the official template changes. Two pages is a common reading target. This preset does not claim to be the official Europass PDF."
  - "Double-check: date of birth and nationality are optional Europass fields. They are printed only when personal.include is true. Marital status is not an official Europass field and is not included."
  - "Double-check: the language grid shows the single CEFR level you wrote. Listening, reading, and speaking are not copied from that one level, because that would invent five assessments."
