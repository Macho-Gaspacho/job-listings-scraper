review_notes:
  - "Double-check: a photo is common on an Italian CV and is not mandatory. It is included only when the file exists and photo.include is true."
  - "Double-check: the GDPR sentence is a widely used formula, and wording varies. It is printed only when gdpr_consent is true. Date of birth is printed only when personal.include is true. Confirm both with the employer or a current public template before you rely on them."
