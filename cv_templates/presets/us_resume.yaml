review_notes:
  - "Double-check: US resumes normally omit a photo, date of birth, age, marital status, and nationality. This preset drops them even if they are in your profile. Federal contractors and a few regulated roles publish their own forms; read the posting before you add those facts back by hand."
  - "Double-check: one page is the usual expectation, and two pages after about ten years. Academic, medical, and federal CVs are often longer. The page count here is a word estimate, not a Word layout."
