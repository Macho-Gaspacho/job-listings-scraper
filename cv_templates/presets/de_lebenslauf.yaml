review_notes:
  - "Double-check: a professional photo is customary on a German Lebenslauf, but the Allgemeines Gleichbehandlungsgesetz (AGG) means an employer cannot require one. This preset includes a photo only when the file exists and photo.include is true."
  - "Double-check: date of birth is still common and increasingly omitted. It is printed only when personal.include is true. Nationality and marital status are not in this preset; older templates used them, and you should add them only when a specific form asks."
  - "Double-check: Ort, Datum, and a signature line are optional. The line is a blank for you to sign. The generator does not invent a city or a signing date. Public-sector applications (öffentlicher Dienst) sometimes ask for more personal data than this preset includes."
