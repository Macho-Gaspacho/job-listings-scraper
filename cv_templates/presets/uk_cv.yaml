  - "Double-check: a modern UK CV is usually two pages on A4, without a photo or a date of birth. Academic CVs and some public-sector forms differ. Equality Act norms are the reason this preset drops the photo and date of birth."
  - "Double-check: 'References available on request' is optional. This line is included only when references_on_request is true. Referee names are never invented."
