# Words used to guess level, language, and visa from a posting.
# Matching is whole words, in any order, and ignores capitals and accents.
# These lists are a starter set for en, de, fr, es, it, nl, pl, and pt.
# They are not a complete dictionary. Language and visa are guesses.

level_entry:
  - intern
  - internship
  - junior
  - graduate
  - entry
  - stagista
  - tirocinante
  - praktikant
  - praktikantin
  - werkstudent
  - werkstudentin
  - stagiaire
  - becario
  - becaria
  - practicante
  - aprendiz
  - estagiário
  - estagiária
  - stażysta
  - stażystka
  - stagiair

level_senior:
  - senior
  - lead
  - principal
  - head

languages:
  English:
    - fluent english
    - native english
    - english native
    - english fluency
  German:
    - fluent german
    - native german
    - german native
    - german required
    - deutsch fließend
    - fließend deutsch
    - verhandlungssicher deutsch
    - deutsch verhandlungssicher
    - deutschkenntnisse
    - muttersprachlich deutsch
  French:
    - fluent french
    - native french
    - français courant
    - francais courant
    - français langue maternelle
    - maitrise du francais
  Spanish:
