# Words used to guess level, language, and visa from a posting.
# Level words match in any order. Language and visa phrases match only when
# the words sit together in the same order. Capitals and accents are ignored.
# These lists are a starter set for en, de, fr, es, it, nl, pl, and pt.
# They are not a complete dictionary. Language and visa are guesses.

level_entry:
  - intern
  - internship
  - junior
  - graduate
  - entry
  - stagista
  - tirocinante
  - praktikant
  - praktikantin
  - werkstudent
  - werkstudentin
  - stagiaire
  - becario
  - becaria
  - practicante
  - aprendiz
  - estagiário
  - estagiária
  - stażysta
  - stażystka
  - stagiair

level_senior:
  - senior
  - lead
  - principal
  - head
  - staff
  # Equivalents of senior, staff, and principal in the starter languages
  # used by synonyms/roles.yaml (de, fr, it, es, nl, pl, pt).
  # Matching is whole words, so "staff" does not match "staffing".
  - leitend
  - leitende
  - leitender
  - leitenden
  - principale
  - hoofd
  - starszy
  - starsza
  - główny
  - główna

