  Portuguese:
    - fluent portuguese
    - native portuguese
    - português fluente
    - portugues fluente
    - português nativo

# "No sponsorship" means the posting says the employer will not sponsor a visa,
# or that the applicant must already have the right to work.
visa_no:
  - no visa sponsorship
  - visa sponsorship is not
  - not offer visa sponsorship
  - do not offer sponsorship
  - no sponsorship
  - must have the right to work
  - must be authorised to work
  - must be authorized to work
  - geen visumsponsoring
  - geen visa sponsorship
  - keine visumsponsoring
  - kein visumsponsoring
  - pas de sponsoring de visa
  - sans parrainage de visa
  - no patrocinamos visados
  - sin patrocinio de visado
  - niente sponsorizzazione del visto
  - permesso di lavoro necessario
  - nie oferujemy sponsorowania wizy
  - bez sponsorowania wizy
  - sem patrocinio de visto
  - autorizacao de trabalho obrigatoria

# "Sponsorship offered" means the posting says a visa can be sponsored,
# or that relocation support is part of the offer.
# A phrase must include a word that is not in "we offer no visa sponsorship",
# because extra words such as "no" are ignored.
visa_yes:
  - visa sponsorship available
  - sponsorship is available
  - visa sponsorship possible
  - visa sponsorship offered
  - sponsorship offered
  - we sponsor visas
  - relocation support
  - relocation assistance
  - visum sponsoring mogelijk
  - visa sponsoring möglich
  - sponsoring de visa possible
  - patrocinio de visado
  - ofrecemos patrocinio de visado
  - sponsorizzazione del visto disponibile
  - supporto per il trasferimento
  - oferujemy sponsorowanie wizy
  - wsparcie relokacji
  - patrocinio de visto disponivel
  - apoio a realocacao
