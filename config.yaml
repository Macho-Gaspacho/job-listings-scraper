# Job search settings
# -------------------
# Change the lists below, save this file, and run:
#     python scrape.py
# You do not need to edit any Python file for a normal search.

# Phrases to search for. Add a line, or delete one, to change the search.
# A line starting with # is a note and is ignored.
# Italian titles are commented out below. Remove the # to include them.
roles:
  - Project Manager
  - Product Manager
  - PMO
  - Product Marketing
  - Market Research Analyst
  # - Responsabile di progetto
  # - Product Marketing Manager
  # - Analista di ricerca di mercato

# Job sites also return loosely related titles. When this is true, a posting
# is kept only if its title contains one of the phrases under that role.
# Matching ignores capital letters. Set this to false to keep everything.
# If you add a new role and do not list phrases for it, all of its results are kept.
require_title_match: true

title_keywords:
  Project Manager:
    - project manager
    - project management
  Product Manager:
    - product manager
    - product owner
  PMO:
    - pmo
    - project management officer
    - project management office
    - project manager
    - project management
  Product Marketing:
    - product marketing
  Market Research Analyst:
    - market research
    - marketing research
    - market insight
    - consumer insight
    - shopper
    - insight

# Where to look, for Indeed and LinkedIn only.
# "remote: true" asks Indeed for work-from-home jobs in that country, and
# adds the word "remote" on LinkedIn (LinkedIn's public search has no
# strict remote-only switch).
# distance_miles is the search radius. 30 miles is about 50 km.
# Job sites measure this in miles, which is why the setting says miles.
# Company career pages and remote boards are filtered separately: Milan
# offices, or remote roles you can do from Italy or the EU.
locations:
  - name: Milan, Italy
    indeed_location: Milan, Lombardy, Italy
    linkedin_location: Milan, Lombardy, Italy
    remote: false
    distance_miles: 30
  - name: Remote
    indeed_location: Italy
    linkedin_location: Italy
    remote: true

# Each source can be turned off by changing enabled to false.
# kind is the "Source type" column in the spreadsheet. Leave kind as it is.
#
# company_pages reads each employer's own careers page. That is the least
# crowded place to apply, because you are not competing in an aggregator inbox.
# we_work_remotely and remote_ok are remote job boards. They are quieter
# than Indeed and LinkedIn, and the link usually goes to the company.
# indeed and linkedin are the crowded aggregators. They are still useful
# for Milan roles that never appear on a startup board.
#
# remotive and working_nomads are wired up but switched off. When they were
# tested, Remotive returned only a handful of unrelated jobs, and Working
# Nomads returned none of these roles. Change enabled to true if you want
# to try them again.
#
# These were tried and left out, because they did not return real public
# listings from this computer (a login wall, an empty page, or a bot check):
# Wellfound, Welcome to the Jungle, Y Combinator Work at a Startup,
# Himalayas, InfoJobs Italia, startup.jobs, and EU-Startups.
sources:
  - id: company_pages
    enabled: true
    kind: company site
  - id: we_work_remotely
    enabled: true
    kind: remote board
  - id: remote_ok
    enabled: true
    kind: remote board
  - id: remotive
    enabled: false
    kind: remote board
  - id: working_nomads
    enabled: false
    kind: remote board
  - id: indeed
    enabled: true
    kind: aggregator
  - id: linkedin
    enabled: true
    kind: aggregator

# Companies whose public careers page is read directly.
# system is the job-posting tool the company uses. token is the public id
# in that tool's address (not a password).
#
# To add a company:
#   1. Open its careers page.
#   2. See which tool it uses, and copy the id from the address:
#        greenhouse  boards.greenhouse.io/THIS  or job-boards.greenhouse.io/THIS
#        lever       jobs.lever.co/THIS
#        ashby       jobs.ashbyhq.com/THIS
#        workable    apply.workable.com/THIS
#        recruitee   THIS.recruitee.com
#        teamtailor  the full https address of the jobs.rss feed
#        bendingspoons  leave token blank (only Bending Spoons uses this)
#   3. Add a block like the ones below, with enabled: true.
# To stop reading a company, set enabled: false. Do not delete the block
# if you might want it again.
#
# The starter list was checked against the public job pages. Each company
# below uses the system named here, and hires in Milan or for remote roles
# a person in Italy or the EU can take. PayFit and Pennylane are examples
# of companies you can switch on later; they are off so the first run stays
# focused on Milan and on AI/product teams.
companies:
  - name: Bending Spoons
    system: bendingspoons
    token: ""
    enabled: true
  - name: Satispay
    system: ashby
    token: satispay
    enabled: true
  - name: Scalapay
    system: greenhouse
    token: scalapaysrl
    enabled: true
  - name: Doctolib
    system: greenhouse
    token: doctolib
    enabled: true
  - name: Qonto
    system: lever
    token: qonto
    enabled: true
  - name: ElevenLabs
    system: ashby
    token: elevenlabs
    enabled: true
  - name: Synthesia
    system: ashby
    token: synthesia
    enabled: true
  - name: Hugging Face
    system: workable
    token: huggingface
    enabled: true
  - name: Alan
    system: ashby
    token: alan
    enabled: true
  - name: Mistral AI
    system: ashby
    token: mistral.ai
    enabled: true
  - name: PayFit
    system: teamtailor
    token: https://careers.payfit.com/jobs.rss
    enabled: false
  - name: Pennylane
    system: ashby
    token: pennylane
    enabled: false

# Country passed to Indeed. Examples: italy, france, germany, spain,
# netherlands, uk, usa. If you change the city, change this too.
country: italy

# How many listings to request per role, per place, per site.
# This applies to Indeed and LinkedIn only. Company pages and remote
# boards return their current open jobs, then this program filters them.
# Higher numbers take longer and are more likely to be throttled.
results_per_search: 10

# Ignore Indeed and LinkedIn postings older than this many days.
# Company career pages and remote boards keep every open matching job,
# even if it was posted earlier. The date is still written in the spreadsheet.
posted_within_days: 30

# Seconds to wait between searches and between company pages.
# Please leave a pause in place.
pause_seconds: 2

# LinkedIn does not include the description in the search results.
# true  = open each LinkedIn posting so the snippet is filled in (slower).
# false = leave LinkedIn descriptions blank and finish faster.
# Indeed includes a description either way. Company pages include one
# when the public page provides it.
fetch_descriptions: true

# Maximum length of the description snippet, in characters.
snippet_characters: 280

# Where the files go. These paths are relative to this config file.
output:
  directory: output
  csv: jobs.csv
  excel: jobs.xlsx
  seen_file: data/seen_jobs.json
